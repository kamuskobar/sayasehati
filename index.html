<style>

.mq{background:linear-gradient(90deg,#0b4f73,var(--b2) 40%,var(--b));color:#fff;overflow:hidden;white-space:nowrap;font-weight:500;font-size:.88rem;padding:8px 0}

.hero{background:linear-gradient(120deg,#fff 0,#fff 55%,#fff4d2);border:1px solid var(--ln);border-radius:20px;box-shadow:var(--sh);padding:26px 30px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:18px 30px;align-items:center;position:relative;overflow:hidden}

.hs b{display:block;font-size:1.6rem;color:var(--g);line-height:1.1}.hs small{color:var(--m);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.bar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:14px}
.sbox{position:relative}.sbox>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--m);pointer-events:none}.sbox input{padding-left:38px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d3dae6;border-radius:10px;font:inherit;font-size:.93rem;background:#fff;color:var(--t);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--b);box-shadow:0 0 0 3px #1b8fd02e}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--g);cursor:pointer}
textarea{min-height:84px;resize:vertical}
label{font-size:.78rem;font-weight:600;color:#4a5668;display:block;margin:12px 0 5px;letter-spacing:.2px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--ln);color:#44546a;background:#fff;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.83rem;font-weight:600;transition:.15s}
.chip:hover{border-color:var(--b);color:var(--b)}.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:14px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.cv{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,#e8edf4,#d6dde8)}.cv img{width:100%;height:100%;object-fit:cover;display:block}
.bd{position:absolute;bottom:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-size:.72rem}
.bd span{background:#000a;backdrop-filter:blur(4px);color:#fff;padding:3px 9px;border-radius:999px;display:inline-flex;gap:5px;align-items:center}.bd .r{color:var(--y)}
.ct{padding:10px 12px 13px}.ct b{font-size:.9rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ct small{color:var(--m);font-size:.78rem}
.box{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:24px;box-shadow:var(--sh);max-width:560px;margin:auto;position:relative}.box.w{max-width:none}
.box h2{font-size:1.25rem;margin:0 0 6px;display:flex;align-items:center;gap:9px;letter-spacing:-.1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(180deg,#d9303b,var(--g));color:#fff;border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;font-size:.9rem;margin-top:14px;box-shadow:0 1px 2px #0003,inset 0 1px 0 #ffffff33;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}.btn:active{transform:none}
.btn.s{background:#fff;color:var(--g);border:1px solid #e6b6ba;box-shadow:none}.btn.s:hover{background:#fff4f4}
.btn.d{background:linear-gradient(180deg,#d6402f,#b02a1d)}.btn.ok{background:linear-gradient(180deg,#25a874,#167f58)}.btn.b{background:linear-gradient(180deg,#2aa3e3,var(--b2))}
.btn.sm{padding:6px 12px;font-size:.8rem;border-radius:8px}.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;background:#eaeef5;padding:4px;border-radius:12px;width:fit-content;max-width:100%}
.tabs button{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border:0;background:none;color:#4a5668;border-radius:9px;cursor:pointer;font:inherit;font-weight:600;font-size:.86rem}
.tabs button:hover{background:#ffffffa0}.tabs button.on{background:#fff;color:var(--g);box-shadow:0 1px 3px #0002}
#modal{position:fixed;inset:0;background:#0f172acc;backdrop-filter:blur(3px);display:none;z-index:40;overflow:auto;padding:18px}
#modal .in{background:#fff;max-width:1000px;margin:auto;border-radius:18px;padding:24px;position:relative;box-shadow:0 20px 60px #0006}
.x{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;font-size:1.3rem;line-height:1;background:#eef1f6;border:0;cursor:pointer;color:#445;z-index:2}.x:hover{background:#e0e5ee}
iframe{width:100%;height:72vh;border:0;border-radius:12px;background:#eef1f6}
.bh{display:flex;gap:18px;align-items:flex-start;margin-bottom:16px;padding-right:38px}
.bh img{width:98px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;box-shadow:var(--sh2);background:#dde3ec;flex:none}
.bh h2{margin:0 0 8px;font-size:1.4rem;line-height:1.25}.bh p{margin:8px 0 0}
.bm{display:flex;flex-wrap:wrap;gap:6px}.pill{background:#eef3fa;color:#36506f;border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:600;display:inline-flex;gap:5px;align-items:center}
@media(max-width:640px){.bh img{width:72px}.bh h2{font-size:1.15rem}}
#fbw{background:#2b3a34;border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
#fbt{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px;color:#fff;font-size:.9rem}
#fbt button{background:#ffffff26;color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}#fbt button:hover{background:#ffffff40}
#fb{height:72vh;display:flex;justify-content:center;align-items:center;padding:6px;color:#fff;overflow:hidden;flex:1}
#fl{width:100%;height:100%}.pg{background:#fff;overflow:hidden}
.pg img{width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
#fbw:fullscreen{border-radius:0;height:100%}#fbw:-webkit-full-screen{border-radius:0;height:100%}
#fbw:fullscreen #fb,#fbw.pfs #fb{height:auto}#fbw:-webkit-full-screen #fb{height:auto}
#fbw.pfs{position:fixed;inset:0;z-index:60;border-radius:0;height:100vh;height:100dvh}
.pbar{height:10px;background:rgba(128,128,128,.35);border-radius:6px;overflow:hidden;margin:8px 0 4px}.pbar i{display:block;height:100%;width:0;background:var(--y);border-radius:6px;transition:width .25s}
#ld{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:100}
#ld .lb{background:#fff;border-radius:14px;padding:22px 26px;width:min(340px,88%);text-align:center;box-shadow:0 8px 30px #0006}
#ld .sp{width:38px;height:38px;border:5px solid #e6e6e6;border-top-color:var(--g);border-radius:50%;margin:0 auto 12px;animation:spn .8s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}#ld .pbar i{background:var(--g)}#ld small{color:var(--m)}
.cred{margin-top:6px;font-size:.88rem;display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center}
.cred code{background:#fff3d1;border:1px solid #f0d98a;border-radius:6px;padding:2px 8px;font-size:.92rem;user-select:all}
.cred .nb{color:var(--m);font-style:italic}.cp{background:#fff;border:1px solid #cfd8e5;color:#4a5668;border-radius:8px;padding:3px 10px;cursor:pointer;font-size:.76rem;font-weight:600;display:inline-flex;gap:5px;align-items:center}.cp:hover{background:#f3f6fa}
.cm{border:1px solid var(--ln);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:.9rem;background:#fafbfd}.cm small{color:var(--m)}.st{color:#f2a900}
.row{display:flex;gap:12px;align-items:center;border:1px solid var(--ln);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:#fff;flex-wrap:wrap}
.row img{width:46px;height:62px;object-fit:cover;border-radius:6px;background:#e3e8ef}.row>div{flex:1;min-width:160px}
.empty{text-align:center;color:var(--m);padding:40px}
footer{text-align:center;color:var(--m);font-size:.8rem;padding:26px 16px 36px}
@media(max-width:700px){header{padding:10px 14px}.logo{font-size:1.05rem}.lg{height:44px}.logo small{font-size:.6rem}nav{margin:0;width:100%}.bar{grid-template-columns:1fr}.hero{padding:20px}.hero h1{font-size:1.35rem}.hs{margin-left:0;width:100%}.hs>div{flex:1;min-width:90px}main{padding:16px 12px 6px}.box{padding:18px}}
.ov{position:fixed;inset:0;background:#0f172acc;backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.ov.top{align-items:flex-start}.ov.dlg{z-index:95}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.sg>div{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:13px;text-align:center;box-shadow:var(--sh)}
.sg b{display:block;font-size:1.65rem;color:var(--g);line-height:1.2}.sg small{color:var(--m);font-weight:600;font-size:.76rem}
.sg.mini{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}.sg.mini b{font-size:1.35rem}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #edf0f5;vertical-align:middle}
th{background:#f5f7fb;color:#4a5668;font-size:.72rem;text-transform:uppercase;letter-spacing:.55px;white-space:nowrap;font-weight:700;position:sticky;top:0;z-index:1}
tr:hover td{background:#fafbfe}tr:last-child td{border-bottom:0}
.bk{display:inline-block;background:#e6f3fb;color:#0d6a99;border-radius:999px;padding:2px 10px;margin:2px 3px 2px 0;font-size:.78rem;font-weight:600}
.fg{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.fg label{margin-top:0}.fg>div{flex:1;min-width:140px}.fg>div.w2{flex:2;min-width:200px}.fg .btn{margin:0}
.tg{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.73rem;font-weight:700}
.tg.ok{background:#e1f5ec;color:#126a47}.tg.er{background:#fde7e4;color:#a02a1e}.tg.in{background:#e2f0fa;color:#0d5d8a}.tg.gr{background:#eceff4;color:#5a6577}
.pnl{background:#f8fafd;border:1px solid var(--ln);border-radius:14px;padding:14px 16px 16px;margin-bottom:14px}.pnl h3{margin:0 0 2px;font-size:.95rem}.pnl label:first-child{margin-top:4px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.tb .btn{margin:0}
.me{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.15rem;flex:none}
.me .nm{font-size:1.1rem;font-weight:700;line-height:1.3}.me .gp{background:#fff3d1;color:#8a5a00}
.ck{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--ln);border-radius:12px;padding:10px 13px;margin:8px 0 0;cursor:pointer;font-weight:400;color:var(--t);font-size:.9rem;letter-spacing:0;background:#fff}
.ck b{font-weight:700}.ck small{display:block;color:var(--m);font-size:.78rem}.ck input{margin-top:4px}.ck:has(input:checked){border-color:var(--b);background:#f0f8fd}
.dz{border:2px dashed #b9c4d6;border-radius:16px;background:#f8fafd;padding:38px 18px;text-align:center;color:var(--m);cursor:pointer;transition:.15s}
.dz.on,.dz:hover{border-color:var(--b);background:#eef7fd;color:var(--b2)}.dz .ic{color:var(--b)}.dz b{color:var(--t);display:block;margin-top:8px}
.imb,.kd{width:min(980px,100%)}
#tw{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:94vw}
.ts{background:#1b2433;color:#fff;padding:10px 18px;border-radius:12px;font-size:.88rem;box-shadow:0 8px 24px #0005;animation:tsi .25s}.ts.ok{background:#157a55}.ts.er{background:#b02a1d}
@keyframes tsi{from{opacity:0;transform:translateY(10px)}}
.dl{background:#fff;border-radius:16px;padding:22px;max-width:430px;width:100%;box-shadow:0 20px 60px #0007;animation:tsi .2s}.dl h3{margin:0 0 8px;font-size:1.05rem}
.dl p{margin:0;color:#3b4658;white-space:pre-wrap;word-break:break-word;font-size:.93rem}.dla{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.dla .btn{margin:0}.dl input{margin-top:10px}
/* ===== KARTU ANGGOTA (85,6 x 54 mm = ukuran kartu ATM / CR80) ===== */
.kartu,.kartu *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.kartu{width:85.6mm;height:54mm;border-radius:3.2mm;position:relative;overflow:hidden;background:#fff;color:#1b2433;font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;line-height:1.2;box-shadow:0 0 0 .18mm #0000002e;flex:none;text-align:left}
.k-top,.kb-t{position:absolute;left:0;right:0;top:0;background:linear-gradient(115deg,#6f0d15,#c8202b 60%,#d93a2f);color:#fff}

.k-top img{width:10.8mm;height:10.8mm;object-fit:contain;background:#fff;border-radius:2.2mm;padding:.5mm;flex:none}

.k-st,.kb-s{position:absolute;left:0;right:0;height:1mm;background:#ffc72c}.k-st{top:15mm}
.k-body{position:absolute;left:4mm;top:17.6mm;width:57mm}

.k-f{display:flex;gap:5mm;margin-top:1.6mm}
.k-f i{display:block;font-style:normal;font-size:1.85mm;font-weight:700;letter-spacing:.25mm;text-transform:uppercase;color:#7a8699}.k-f b{display:block;font-size:3.3mm;font-weight:700}
.k-cl{position:absolute;right:4.2mm;top:18.4mm;width:17mm;height:17mm;border-radius:50%;background:linear-gradient(135deg,#1b8fd0,#0d6a99);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 .6mm #fff,0 0 0 1.1mm #1b8fd066}
.k-cl small{font-size:1.9mm;letter-spacing:.3mm;font-weight:700;opacity:.95}.k-cl b{font-size:8.2mm;line-height:1;font-weight:800}
.k-bc{position:absolute;left:0;right:0;top:38.4mm;height:13.4mm;background:#f1f4f9;padding:1.4mm 4mm 0}

.k-bc span{display:block;font-size:2.3mm;letter-spacing:.7mm;color:#44546a;margin-top:.5mm;font-weight:600;width:54mm;text-align:center}
.k-bc em{position:absolute;right:4mm;top:3.2mm;width:20mm;font-style:normal;font-size:1.8mm;color:#7a8699;text-align:right;line-height:1.3}
.k-ft{position:absolute;left:0;right:0;bottom:0;height:2.2mm;background:linear-gradient(90deg,#1b8fd0,#c8202b)}
.kb-t{height:9mm;display:flex;align-items:center;justify-content:center;font-size:3mm;font-weight:800;letter-spacing:.4mm}.kb-s{top:9mm}
.kb ol{position:absolute;left:4mm;right:4mm;top:11.6mm;margin:0;padding-left:3.6mm;font-size:2.5mm;line-height:1.45;color:#2b3648}.kb ol li{margin-bottom:.5mm}
.kb-f{position:absolute;left:4mm;right:4mm;top:36mm;border-top:.2mm dashed #c4cddb;padding-top:1.5mm;font-size:2.2mm;line-height:1.4;color:#5a687c}
.kw{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:14px 0}.kz{zoom:1.3}
@media(max-width:760px){.kz{zoom:.85}}
#pa{display:none}.kx{display:block}
@media print{
 html,body{background:#fff!important;margin:0!important;padding:0!important}
 body.pr>*:not(#pa){display:none!important}
 body.pr #pa{display:block!important}
 .sh{break-after:page;page-break-after:always}.sh:last-child{break-after:auto;page-break-after:auto}
 .sh.a4{width:210mm;height:296.4mm;display:grid;grid-template-columns:repeat(2,85.6mm);grid-template-rows:repeat(5,54mm);gap:4mm 6mm;justify-content:center;align-content:center;overflow:hidden}
 .sh.c1{width:85.6mm;height:54mm;overflow:hidden}
 .sh.c1 .kartu{border-radius:0;box-shadow:none}
}
</style>

function view(m,id){const b=books.find(x=>x.id==id);flipClean();$('t1').className=m=='pdf'?'on':'';$('t2').className=m=='fb'?'on':'';
  if(m=='pdf')$('vw').innerHTML=`<iframe src="https://drive.google.com/file/d/${fid(b.pdf)}/preview" allowfullscreen></iframe>`;
  else{$('vw').innerHTML=`<div id="fbw"><div id="fbt"><button onclick="PF&&PF.flipPrev()">← Sebelumnya</button><span id="fpg">–</span><button onclick="PF&&PF.flipNext()">Berikutnya →</button><button id="fsb" onclick="toggleFs()">${ic('full',15)} Layar Penuh</button></div><div id="fb"></div></div>`;flip(id)}}
const lj=s=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=s;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
let PF=null,FT=0,BLOBS=[];
const prog=(t,p)=>`<div style="width:min(340px,85%);text-align:center"><div>${t}</div><div class="pbar"><i style="width:${p}%"></i></div><small>${Math.round(p)}%</small></div>`;
const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement||($('fbw')&&$('fbw').classList.contains('pfs')));
function exitFs(){const w=$('fbw');if(document.fullscreenElement||document.webkitFullscreenElement){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}if(w)w.classList.remove('pfs');document.body.style.overflow=''}
function fsUi(){const bt=$('fsb');if(bt)bt.innerHTML=isFs()?ic('x',15)+' Keluar Layar Penuh':ic('full',15)+' Layar Penuh';[150,500,1000].forEach(t=>setTimeout(()=>window.dispatchEvent(new Event('resize')),t))}
function toggleFs(){const w=$('fbw');if(!w)return;
  if(isFs()){exitFs();fsUi();return}
  const rq=w.requestFullscreen||w.webkitRequestFullscreen,fallback=()=>{w.classList.add('pfs');document.body.style.overflow='hidden';fsUi()};
  if(!rq)return fallback();
  try{const p=rq.call(w);if(p&&p.catch)p.catch(fallback)}catch(e){fallback()}}
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,fsUi));
function flipClean(){FT++;exitFs();try{PF&&PF.destroy()}catch(e){}PF=null;BLOBS.forEach(u=>URL.revokeObjectURL(u));BLOBS=[]}
async function flip(id){const tok=++FT,box=()=>tok==FT?$('fb'):null;
  try{
   box().innerHTML=prog('Mengunduh PDF…',3);
   if(!window.pdfjsLib)await lj('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
   if(!window.St)await lj('https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js');
   pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
   const b64=await api({a:'pdf',id});if(!box())return;
   const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
   const pdf=await pdfjsLib.getDocument({data:u8}).promise,n=pdf.numPages,urls=[];let ratio=1.4;
   /* resolusi render mengikuti layar (HP/tablet/komputer) agar teks tajam */
   const dpr=Math.min(window.devicePixelRatio||1,3),TW=Math.round(Math.min(1400,Math.max(900,innerWidth*dpr*.95)));
   for(let i=1;i<=n;i++){if(!box())return;box().innerHTML=prog(`Menyiapkan halaman ${i} dari ${n}…`,15+85*(i-1)/n);
    const pg=await pdf.getPage(i),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:TW/v0.width});
    const c=document.createElement('canvas');c.width=Math.floor(v.width);c.height=Math.floor(v.height);
    const cx=c.getContext('2d',{alpha:false});cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:cx,viewport:v}).promise;
    const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));c.width=c.height=0;pg.cleanup();
    if(tok!=FT)return;const u=URL.createObjectURL(bl);BLOBS.push(u);urls.push(u);if(i==1)ratio=v0.height/v0.width}
   if(!box())return;
   const fl=document.createElement('div');fl.id='fl';
   urls.forEach((u,i)=>{const d=document.createElement('div');d.className='pg';if(i==0||i==n-1)d.dataset.density='hard';const im=new Image();im.decoding='async';im.draggable=false;im.src=u;d.appendChild(im);fl.appendChild(d)});
   box().innerHTML='';box().appendChild(fl);
   /* mode HTML (bukan canvas) => gambar dirender browser dengan resolusi asli layar, tidak blur */
   PF=new St.PageFlip(fl,{width:500,height:Math.round(500*ratio),size:'stretch',minWidth:200,maxWidth:1400,minHeight:260,maxHeight:2000,showCover:true,maxShadowOpacity:.4,mobileScrollSupport:false});
   PF.loadFromHTML(fl.querySelectorAll('.pg'));
   const upd=()=>{const p=$('fpg');if(p&&PF)p.textContent='Halaman '+(PF.getCurrentPageIndex()+1)+' / '+n};upd();PF.on('flip',upd);
  }catch(e){const x=box();if(x)x.innerHTML='<div style="padding:16px;text-align:center">Flipbook gagal dimuat ('+esc(e&&e.message||e)+'). Pastikan PDF dibagikan "Siapa saja yang memiliki link" dan ukurannya &lt; 20 MB, atau gunakan mode Baca PDF.</div>'}}

   <div class="kw kz">${kFront(list[0],u)}${kBack()}</div>
   <div class="fg"><div style="min-width:260px"><label class="ck"><input type="radio" name="km" value="a4" checked><span><b>Lembar A4</b><small>10 kartu per halaman, tinggal digunting.</small></span></label></div>
   <div style="min-width:260px"><label class="ck"><input type="radio" name="km" value="c1"><span><b>Printer kartu (PVC)</b><small>1 kartu per halaman, ukuran 85,6 × 54 mm.</small></span></label></div></div>
   <label class="ck"><input type="checkbox" id="kbk" checked><span><b>Sertakan sisi belakang (tata tertib)</b><small>Untuk cetak bolak-balik (duplex, balik di sisi panjang) atau balik kertas manual.</small></span></label>
   <div class="tb" style="margin-top:16px"><button class="btn" onclick="kartuGo()">${ic('print',17)} Cetak / Simpan PDF</button><button class="btn s" onclick="$('kdlg').remove()">Tutup</button></div>
   <p class="mu" style="margin:6px 0 0">Pada jendela cetak: atur skala <b>100% (Actual size)</b>, margin <b>None</b>, aktifkan <b>Background graphics</b>. Pilih "Simpan sebagai PDF" untuk mengunduh berkas.</p></div>`;
  document.body.appendChild(o);bcRender(o)}
async function kartuBuat(list,mode,back){
  const u=await logoUrl(),F=a=>kFront(a,u);let h='';
  if(mode=='a4'){for(let i=0;i<list.length;i+=10){const ch=list.slice(i,i+10);h+=`<section class="sh a4">${ch.map(F).join('')}</section>`;
      if(back){let b='';for(let j=0;j<ch.length;j+=2)b+=(ch[j+1]?kBack():'<i class="kx"></i>')+kBack();h+=`<section class="sh a4">${b}</section>`}}}
  else list.forEach(a=>{h+=`<section class="sh c1">${F(a)}</section>`;if(back)h+=`<section class="sh c1">${kBack()}</section>`});
  const pa=$('pa');pa.innerHTML=h;await bcRender(pa);
  await Promise.all([...pa.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):0));
  $('pgs').textContent=mode=='a4'?'@page{size:A4 portrait;margin:0}':'@page{size:85.6mm 54mm;margin:0}';
  document.body.classList.add('pr')}
async function kartuGo(){const m=document.querySelector('input[name=km]:checked').value,bk=$('kbk').checked;
  try{await loading('Menyiapkan kartu…',()=>kartuBuat(KL,m,bk))}catch(e){alert('⚠ '+(e.message||e));return}
  setTimeout(()=>window.print(),80)}
function kartuBersih(){document.body.classList.remove('pr');$('pa').innerHTML='';$('pgs').textContent=''}
window.addEventListener('afterprint',kartuBersih);

/* ===== IMPORT / EXPORT / TEMPLATE EXCEL ===== */
const RM={i:1,ii:2,iii:3,iv:4,v:5,vi:6};
function nKelas(v){const s=String(v??'').toLowerCase().replace(/kelas/g,'').trim();if(!s)return '';let m=s.match(/^([1-6])(?!\d)/);if(m)return m[1];m=s.match(/^(vi|v|iv|iii|ii|i)(?![a-z])/);return m?String(RM[m[1]]):''}
function agParse(aoa){let hr=-1;const ix={n:0,m:1,k:2};
  for(let i=0;i<Math.min(aoa.length,10);i++){const r=(aoa[i]||[]).map(x=>String(x).trim().toLowerCase());
    if(r.some(x=>/^nis(n)?$/.test(x))){hr=i;r.forEach((x,j)=>{if(/^nis/.test(x))ix.n=j;else if(/nama/.test(x))ix.m=j;else if(/kelas|rombel/.test(x))ix.k=j});break}}
  const rows=[];
  for(let i=hr+1;i<aoa.length;i++){const r=aoa[i]||[],n=String(r[ix.n]??'').replace(/\s+/g,'').replace(/^'/,''),m=String(r[ix.m]??'').trim().replace(/\s+/g,' '),k0=String(r[ix.k]??'').trim();
    if(!n&&!m&&!k0)continue;rows.push({baris:i+1,nisn:n,nama:m,kelasRaw:k0,kelas:nKelas(k0)})}
  return rows}
function agCek(R,upd){const ada=new Set(AD.anggota.map(a=>String(a.nisn).trim())),seen={};
  for(const r of R){r.ket='';const bad=t=>{r.st='err';r.ket=t};
    if(/^contoh/i.test(r.nama)){r.st='skip';r.ket='Baris contoh, dilewati';continue}
    if(!r.nisn){bad('NISN kosong');continue}
    if(!/^\d+$/.test(r.nisn)){bad('NISN harus berupa angka');continue}
    if(!r.nama){bad('Nama kosong');continue}
    if(!r.kelas){bad('Kelas harus 1 sampai 6');continue}
    if(seen[r.nisn]){r.st='skip';r.ket='Duplikat di file (baris '+seen[r.nisn]+')';continue}
    seen[r.nisn]=r.baris;
    if(ada.has(r.nisn)){if(upd){r.st='upd'}else{r.st='skip';r.ket='NISN sudah terdaftar'}}else r.st='new';
    if(r.nisn.length!=10)r.ket=(r.ket?r.ket+'. ':'')+'NISN tidak 10 digit, periksa kembali'}}
async function agTemplate(){try{await needX()}catch(e){alert('⚠ Gagal memuat pustaka Excel. Periksa koneksi internet.');return}
  const ws=XLSX.utils.aoa_to_sheet([['NISN','Nama','Kelas'],['9999000001','CONTOH - Ahmad Rizky (hapus baris ini)','1'],['9999000002','CONTOH - Siti Aisyah (hapus baris ini)','4'],['9999000003','CONTOH - Budi Santoso (hapus baris ini)','6']]);
  for(let r=1;r<=500;r++)['A','B','C'].forEach(c=>{const k=c+r;if(!ws[k])ws[k]={t:'s',v:''};if(r>1)ws[k].z='@'});
  ws['!ref']='A1:C500';ws['!cols']=[{wch:18},{wch:42},{wch:10}];
  const pt=XLSX.utils.aoa_to_sheet([['PETUNJUK PENGISIAN'],[''],['1. Isi data pada sheet "Data Anggota", satu siswa per baris. Jangan mengubah judul kolom (NISN, Nama, Kelas).'],['2. NISN hanya berisi angka (tanpa spasi atau tanda baca). Kolom sudah berformat teks agar angka 0 di depan tidak hilang.'],['3. Kelas diisi angka 1 sampai 6 (penulisan "Kelas 5", "5A", atau "V" juga dikenali).'],['4. HAPUS 3 baris contoh (diawali kata CONTOH) sebelum mengunggah. Baris contoh akan dilewati otomatis.'],['5. Simpan file (.xlsx), lalu unggah melalui Admin > Anggota > Import Excel.'],['6. Maksimal 2000 baris per sekali impor.']]);
  pt['!cols']=[{wch:110}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Data Anggota');XLSX.utils.book_append_sheet(wb,pt,'Petunjuk');
  XLSX.writeFile(wb,'Template-Data-Anggota.xlsx')}
async function agExport(){if(!AD.anggota.length){alert('Belum ada data anggota untuk diekspor');return}
  try{await needX()}catch(e){alert('⚠ Gagal memuat pustaka Excel. Periksa koneksi internet.');return}
  const L=[...AD.anggota].sort(cmp),ws=XLSX.utils.aoa_to_sheet([['NISN','Nama','Kelas'],...L.map(a=>[String(a.nisn),String(a.nama),String(a.kelas)])]);
  for(let r=2;r<=L.length+1;r++)ws['A'+r].z='@';
  ws['!cols']=[{wch:18},{wch:42},{wch:10}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Data Anggota');XLSX.writeFile(wb,'Data-Anggota-SDN1Raja-'+ymd()+'.xlsx');toast('Data anggota diekspor ('+L.length+' baris)','ok')}
let IM=null;
function agImport(){const o=document.createElement('div');o.className='ov top';o.id='imd';
  o.innerHTML=`<div class="box w imb"><button class="x" onclick="$('imd').remove()">×</button><h2>${ic('upload',22)} Import Data Anggota</h2><p class="mu" style="margin:0 0 14px">Unggah file Excel (.xlsx, .xls) atau CSV dengan kolom <b>NISN</b>, <b>Nama</b>, dan <b>Kelas</b>. Belum punya format? <a href="#" onclick="agTemplate();return false">Unduh template Excel</a>.</p><div id="imc"></div></div>`;
  document.body.appendChild(o);imDrop()}
function imDrop(){IM=null;$('imc').innerHTML=`<div class="dz" id="dz">${ic('sheet',40)}<b>Tarik dan lepas file ke sini</b><div>atau klik untuk memilih file</div><small>Format: .xlsx, .xls, .csv</small></div><input type="file" id="imf" accept=".xlsx,.xls,.csv" hidden>`;
  const dz=$('dz'),f=$('imf');dz.onclick=()=>f.click();f.onchange=()=>agRead(f.files[0]);
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};dz.ondragleave=()=>dz.classList.remove('on');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');agRead(e.dataTransfer.files[0])}}
async function agRead(f){if(!f)return;IM=null;
  try{await loading('Membaca file…',async()=>{await needX();
    const wb=/\.csv$/i.test(f.name)?XLSX.read(await f.text(),{type:'string'}):XLSX.read(await f.arrayBuffer(),{type:'array'});
    const nm=wb.SheetNames.find(n=>/anggota|siswa/i.test(n))||wb.SheetNames[0],aoa=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:false,defval:''});
    IM={file:f.name,rows:agParse(aoa),upd:0}})}catch(e){alert('⚠ File tidak dapat dibaca: '+(e&&e.message||e));return}
  imPreview()}
function imPreview(){const R=IM.rows;
  if(!R.length){$('imc').innerHTML=`<p class="empty">Tidak ada baris data yang terbaca. Pastikan kolom NISN, Nama, dan Kelas terisi.</p><button class="btn s" onclick="imDrop()">Pilih file lain</button>`;return}
  agCek(R,IM.upd);const c={new:0,upd:0,skip:0,err:0};R.forEach(r=>c[r.st]++);const ok=c.new+c.upd,tg={new:['ok','Baru'],upd:['in','Diperbarui'],skip:['gr','Dilewati'],err:['er','Error']};
  $('imc').innerHTML=`<p class="mu" style="margin:0 0 10px">File: <b>${esc(IM.file)}</b></p>
   <div class="sg mini"><div><b>${R.length}</b><small>Baris data</small></div><div><b style="color:#157a55">${c.new}</b><small>Baru</small></div><div><b style="color:#0d6a99">${c.upd}</b><small>Diperbarui</small></div><div><b style="color:#667385">${c.skip}</b><small>Dilewati</small></div><div><b>${c.err}</b><small>Error</small></div></div>
   <label class="ck" style="margin:0 0 12px"><input type="checkbox" ${IM.upd?'checked':''} onchange="IM.upd=this.checked?1:0;imPreview()"><span><b>Perbarui data jika NISN sudah terdaftar</b><small>Jika tidak dicentang, NISN yang sudah ada akan dilewati.</small></span></label>
   <div class="tw" style="max-height:340px;overflow:auto"><table><tr><th>Baris</th><th>NISN</th><th>Nama</th><th>Kelas</th><th>Status</th></tr>${R.slice(0,300).map(r=>`<tr><td>${r.baris}</td><td>${esc(r.nisn)}</td><td>${esc(r.nama)}</td><td>${esc(r.kelas||r.kelasRaw)}</td><td><span class="tg ${tg[r.st][0]}">${tg[r.st][1]}</span> ${r.ket?`<small class="mu">${esc(r.ket)}</small>`:''}</td></tr>`).join('')}</table></div>${R.length>300?`<p class="mu">Menampilkan 300 dari ${R.length} baris (semua baris tetap diproses).</p>`:''}
   <div class="tb" style="margin-top:14px"><button class="btn" ${ok?'':'disabled'} onclick="imGo()">${ic('check',16)} Impor ${ok} data</button><button class="btn s" onclick="imDrop()">Pilih file lain</button><button class="btn s" onclick="$('imd').remove()">Batal</button></div>`}
async function imGo(){const send=IM.rows.filter(r=>r.st=='new'||r.st=='upd').map(r=>({baris:r.baris,nisn:r.nisn,nama:r.nama,kelas:r.kelas}));
  const r=await admDo({a:'adminAnggotaImport',rows:send,update:IM.upd});
  if(r){if($('imd'))$('imd').remove();alert('Impor selesai\nDitambahkan: '+r.tambah+'\nDiperbarui: '+r.ubah+'\nDilewati: '+r.lewati+(r.gagal&&r.gagal.length?'\nGagal: '+r.gagal.length+' (baris '+r.gagal.slice(0,10).map(g=>g.baris).join(', ')+')':''))}}
